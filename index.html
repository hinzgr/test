<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundbüro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .logo {
            align-self: flex-end;
            background-color: #fff;
            border: 2px solid #000;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .logo span {
            color: red;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 320px;
            border: 2px solid #000;
            border-radius: 6px;
            padding: 20px 16px;
            margin-bottom: 20px;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 22px;
            text-decoration: none;
            color: #000;
            background-color: #fff;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #f0f0f0;
        }

        .icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="logo">⊕ <span>TU<br>ES</span></div>

    <a href="suchen.html" class="btn">
        Suchen <span class="icon">🔍</span>
    </a>

    <a href="hochladen.html" class="btn">
        Hochladen <span class="icon">⬆️</span>
    </a>

</body>
</html>
