<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochladen – Fundbüro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .logo {
            align-self: flex-end;
            border: 2px solid #000;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .logo span { color: red; }

        .field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #000;
            border-radius: 6px;
            padding: 18px 16px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 16px;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 18px;
            color: #333;
            cursor: pointer;
        }

        .field input[type="file"] {
            display: none;
        }

        .field input[type="text"],
        .field textarea {
            border: none;
            outline: none;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 18px;
            width: 100%;
            background: transparent;
            color: #333;
        }

        textarea {
            resize: none;
            height: 50px;
        }

        .btn-fertig {
            background-color: #5cc8a8;
            border: none;
            border-radius: 6px;
            padding: 12px 40px;
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-fertig:hover {
            background-color: #4ab090;
        }
    </style>
</head>
<body>

    <div class="logo">⊕ <span>TU<br>ES</span></div>

    <label class="field">
        Foto hochladen <span>⬆️</span>
        <input type="file" accept="image/*">
    </label>

    <div class="field">
        <input type="text" placeholder="Name des Objekts">
    </div>

    <div class="field">
        <textarea placeholder="Beschreibung"></textarea>
    </div>

    <button class="btn-fertig">Fertig</button>

</body>
</html>
